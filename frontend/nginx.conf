# Servidor web do frontend. Serve os arquivos estáticos e repassa (proxy) as chamadas
# de API para os microsserviços pela rede interna do Docker Compose.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/dados/produtos  ->  http://servico-dados:5001/produtos   (prefixo removido)
    location /api/dados/ {
        proxy_pass http://servico-dados:5001/;
    }

    # /relatorios/estoque  ->  http://servico-relatorios:5003/relatorios/estoque (caminho mantido)
    location /relatorios/ {
        proxy_pass http://servico-relatorios:5003;
    }
}